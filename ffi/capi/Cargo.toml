[package]
name = "servo-capi"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "C API for the Servo rendering engine"

[lib]
name = "servo_capi"
path = "lib.rs"
crate-type = ["cdylib"]

[features]
capi = [] # Needed by `cargo-c`.
# TODO: Need to think about which features from servo can be
# exposed here for conditional compilation of C API.
# Compile the content-process entry point, `servo_content_process_main`.
#
# Off by default, because turning it on pulls upstream's multiprocess support
# into the payload. The symbol is exported either way: without this feature it
# resolves and returns SERVO_CONTENT_PROCESS_UNSUPPORTED, so an embedder detects
# the gap by calling it rather than by failing to find it.
multiprocess = ["servo/multiprocess"]

[dependencies]
# Used directly by the clipboard-access gate (`clipboard.rs`) to reach the OS
# clipboard on an allow. `components/servo`'s own default clipboard delegate does
# the same thing, but it is `pub(crate)` there, so this crate cannot compose with
# it and talks to the OS clipboard itself instead. Already in the workspace graph
# through `components/servo`'s own `clipboard` feature.
arboard = { workspace = true }
dpi = { workspace = true }
euclid = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
# TODO: We need 'baked-in-resources' as the `inventory` based `ResourceReader`
# doesn't work when libservo is a cdylib.
servo = { workspace = true, features = ["js_jit", "baked-in-resources", "bundled_freetype"] }
url = { workspace = true }

# TODO: ANGLE is needed on Windows to provide libEGL.dll and libGLESv2.dll
# for surfman's EGL backend. WGL doesn't work at least on CI.
# This should be eventually be exposed as a feature of this crate.
[target.'cfg(target_os = "windows")'.dependencies]
servo = { workspace = true, features = ["no-wgl"] }

[package.metadata.capi.header]
subdirectory = "servo"

[package.metadata.capi.library]
name = "servo_capi"

[lints.rust]
# `capi_full` is set by ffi/capi-full, which compiles this crate's source as its own.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(capi_full)'] }

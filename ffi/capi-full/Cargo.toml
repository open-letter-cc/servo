# SPDX-License-Identifier: LicenseRef-OpenLetter-Tools
# The full-surface C ABI cdylib for this fork.
#
# WHY THIS EXISTS: `ffi/capi` is `crate-type = ["cdylib"]`, so no Rust crate can
# depend on it, and its `RenderingContext`/`ServoWebViewBuilder` internals are
# private to that crate. The twelve embedding entry points an external embedder
# needs (native rendering context, input, focus, resize, HiDPI) therefore cannot
# be added from outside `ffi/capi` by *linking* to it - they can only be added by
# a cdylib that *contains* it. This crate is that cdylib: `src/lib.rs` includes
# `ffi/capi/lib.rs` verbatim (no copy, no fork - the same source file the
# in-tree `servo-capi` builds) and `src/native.rs` adds the missing twelve.
#
# `servo-capi` keeps building and shipping exactly as before; this crate adds to
# its surface, never changes it.
[package]
name = "servo-capi-full"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Servo C API cdylib carrying the full embedding surface, including the native-window, input, focus and HiDPI entry points not present in ffi/capi"

build = "build.rs"

[lib]
# NOT `servo_capi`: `ffi/capi` already claims that lib name in this workspace and
# two cdylibs writing `target/<profile>/servo_capi.dll` is an output-filename
# collision that breaks `cargo build --workspace`. The shipped artifact is
# renamed to `servo.dll` by .github/workflows/motor-controller.yaml; embedders
# load it by file name, not by the PE export directory's internal name.
name = "servo_capi_full"
path = "src/lib.rs"
crate-type = ["cdylib"]

# Deliberately identical to ffi/capi's, so that building this crate and
# `servo-capi` in one `cargo` invocation resolves one feature set for `servo`
# and compiles SpiderMonkey once.
[lints]
workspace = true

[features]
# Compile the content-process entry point, `servo_content_process_main`.
#
# Off by default, because turning it on pulls upstream's multiprocess support
# into the payload. The symbol is exported either way: without this feature it
# resolves and returns SERVO_CONTENT_PROCESS_UNSUPPORTED, so an embedder detects
# the gap by calling it rather than by failing to find it.
multiprocess = ["servo/multiprocess"]

[dependencies]
dpi = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
servo = { workspace = true, features = ["js_jit", "baked-in-resources", "bundled_freetype"] }
url = { workspace = true }

# Needed by `servo_rendering_context_create_native` and friends, which the
# in-tree capi does not have and so does not depend on. Both are already in the
# workspace graph (`euclid` and `raw-window-handle` are direct dependencies of
# `components/shared/paint`), so this adds no new dependency to the fork.
euclid = { workspace = true }
raw-window-handle = { workspace = true }

# Mirrors `ffi/capi`'s own dependency of the same name, needed because this crate
# compiles `ffi/capi/lib.rs`'s clipboard-access gate verbatim too, under the same
# target condition: `arboard` has no Android or OpenHarmony backend.
[target.'cfg(not(any(target_os = "android", target_env = "ohos")))'.dependencies]
arboard = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
servo = { workspace = true, features = ["no-wgl"] }
# Needed by `servo_rendering_context_create_shared`, which builds its own surfman
# context on a D3D11 texture it creates. All five are already in the graph
# through surfman and `components/shared/paint`, at the same versions.
gleam = { workspace = true }
glow = { workspace = true }
surfman = { workspace = true, features = ["sm-angle-default"] }
winapi = { workspace = true, features = ["d3d11", "dxgi", "dxgi1_2", "dxgiformat", "dxgitype", "handleapi", "processthreadsapi", "winbase", "winerror", "winnt"] }
wio = { workspace = true }

# The shared-surface tests stand up a second D3D11 device as the consumer.
[target.'cfg(target_os = "windows")'.dev-dependencies]
winapi = { workspace = true, features = ["d3d11", "d3d11_1", "d3dcommon", "dxgi"] }
wio = { workspace = true }

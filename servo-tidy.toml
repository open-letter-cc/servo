[configs]
skip-check-licenses = false
disallowed-coauthors = [
    "copilot@github.com",
    "cursoragent@cursor.com",
    "gemini-cli@users.noreply.github.com",
    "gemini-code-assist[bot]@users.noreply.github.com",
    "gemini-code-assist@google.com",
    "noreply@anthropic.com",
    "claude@anthropic.com",
]

[ignore]
# Files that are ignored for all tidy and lint checks.
files = [
    # The fork's own separate files, under LicenseRef-OpenLetter-Tools (see
    # LICENSES/); tidy would demand the MPL header on them.
    "./components/script/dom/embedderrequest.rs",
    "./components/script_bindings/webidls/EmbedderRequest.webidl",
    "./ffi/capi-full/Cargo.toml",
    "./ffi/capi-full/README.md",
    "./ffi/capi-full/build.rs",
    "./ffi/capi-full/src/native.rs",
    "./ffi/capi-full/src/shared_surface.rs",
    "./ffi/capi-full/src/shared_surface_tests.rs",
    "./ffi/capi/clipboard.rs",
    "./tests/capi/c/test_clipboard.c",
    "./tests/capi/c/test_control_origin.c",
    "./tests/capi/c/test_frame_events.c",
    "./tests/capi/c/test_multiprocess.c",
    "./tests/capi/c/test_page_request.c",
    "./tests/capi/c/test_permission.c",
    "./tests/capi/c/test_read_frame.c",
    "./tests/capi/c/test_resize.c",
    "./tests/capi/c/test_resource_request.c",
    "./tests/capi/tests/c_clipboard_tests.rs",
    "./tests/capi/tests/c_control_origin_tests.rs",
    "./tests/capi/tests/c_frame_events_tests.rs",
    "./tests/capi/tests/c_page_request_pref_off_tests.rs",
    "./tests/capi/tests/c_page_request_tests.rs",
    "./tests/capi/tests/c_permission_tests.rs",
    "./tests/capi/tests/c_read_frame_tests.rs",
    "./tests/capi/tests/c_resize_tests.rs",
    "./tests/capi/tests/c_resource_request_tests.rs",
    "./tests/capi/tests/multiprocess_containment.rs",
    # The embedder page-request namespace has no specification: it is this
    # fork's own, exposed behind a preference, and documented in the file.
    "./components/script_bindings/webidls/EmbedderRequest.webidl",
    "./components/shared/net/tests/parsable_mime/text",
    "./components/default-resources/resources/hsts_preload.fstmap",
    "./tests/wpt/meta/MANIFEST.json",
    "./tests/wpt/mozilla/meta/MANIFEST.json",
    # Long encoded string
    "./tests/wpt/mozilla/tests/mozilla/resources/brotli.py",
    "./tests/wpt/webgl/meta/MANIFEST.json",
    # Upstream code from Khronos/WebGL uses tabs for indentation
    "./tests/wpt/webgl/tests",
    # Vendored from upstream
    "./tests/blink_perf_tests/perf_tests",
    "./tests/wpt/webgpu/tests",
    # Our import script is not currently respecting the lint.
    "./tests/wpt/webgl/tools/import-conformance-tests.py",
    # Ignore those files since the issues reported are on purpose
    "./tests/html/bad-line-ends.html",
    "./tests/wpt/mozilla/tests/css/fonts",
    "./tests/wpt/mozilla/tests/css/pre-with-tab.html",
    "./tests/wpt/mozilla/tests/mozilla/textarea-placeholder.html",
]
# Directories that are ignored for the non-WPT tidy check.
directories = [
    # Test have expectations in them, causing tidy to fail.
    "./support/crown/tests",
    # Upstream
    "./support/android/apk",
    "./tests/wpt/harness",
    "./tests/wpt/tests",
    "./tests/wpt/mozilla/tests/mozilla/referrer-policy",
    "./tests/wpt/mozilla/tests/webgl",
    "./python/tidy/tests",
    "./python/mach",
    # The fork's own module, under its own licence; tidy would demand an MPL header.
    "./vendor/motor-controller",
    # Generated and upstream code combined with our own. Could use cleanup
    "./target",
    "./support/crown/target",
    "./third_party",
    "./components/script_bindings/third_party",
    # Cache files generated by wptrunner which fail the EOF newlines check.
    "./tests/wpt/meta/.cache",
    "./tests/wpt/mozilla/meta/.cache",
    "./tests/wpt/webgl/meta/.cache",
]

# Directories that are checked for correct file extension
[check_ext]
# directory, list of expected file extensions
"./components/script_bindings/webidls" = [".webidl", "noidl"]

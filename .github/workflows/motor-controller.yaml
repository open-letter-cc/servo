# Produces a Windows libservo DLL that an external embedder can download and
# drop into its own tree, plus a check that the motor-controller seam still
# builds against a real libservo.
#
# Deliberately separate from windows.yml: that workflow is upstream's
# mach-driven servoshell/nightly pipeline. This one exists only to hand a
# built engine to an embedder, so it stays plain `cargo` and does not share
# windows.yml's self-hosted-runner selection.
name: Motor Controller

on:
  # NOTE: kept in sync by hand with the `pull_request` list below. GitHub
  # Actions does not expand YAML anchors, so the duplication is unavoidable.
  push:
    paths:
      - "vendor/motor-controller/**"
      - "vendor/zdr-capi-shim/**"
      - "ffi/capi/**"
      - "components/servo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/motor-controller.yaml"
  pull_request:
    paths:
      - "vendor/motor-controller/**"
      - "vendor/zdr-capi-shim/**"
      - "ffi/capi/**"
      - "components/servo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/motor-controller.yaml"
  # So the DLL can be rebuilt without touching source.
  workflow_dispatch:
    inputs:
      multiprocess:
        description: >-
          Build with upstream's multiprocess feature on. Off for every push, so
          the payload a push produces is always the single-process one.
        type: boolean
        default: false
      release:
        description: >-
          Also publish the payload as a GitHub release tagged after this commit.
          Off for every push: a release is permanent and a push is not, so this
          is only ever asked for deliberately.
        type: boolean
        default: false

# The multiprocess variant is keyed separately, so dispatching one does not
# cancel the push build of the default payload. Without that they share a group
# and the second to start kills the first.
concurrency:
  group: motor-controller-${{ github.ref }}-${{ inputs.multiprocess && 'multiprocess' || 'default' }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  # One target dir for every cargo invocation in this job. vendor/motor-controller
  # is in the root workspace's `exclude` list, so it is its own workspace and
  # would otherwise build libservo a second time into its own target/. Sharing
  # the dir also keeps the artifact path literally `target/release/`.
  CARGO_TARGET_DIR: ${{ github.workspace }}\target
  # clang_sys searches the msys path before Program Files\LLVM.
  LIBCLANG_PATH: C:\Program Files\LLVM\bin
  # What `mach build` sets on Windows; raw cargo does not get it for free.
  CC: clang-cl.exe
  CXX: clang-cl.exe
  RUSTUP_WINDOWS_PATH_ADD_BIN: 1

jobs:
  build:
    name: Windows libservo DLL
    runs-on: windows-latest
    # `contents: write` is only needed by the release step, which is gated behind
    # an explicit dispatch input. Declared here because the default token is
    # read-only when the repository is configured that way, and a release that
    # fails on permissions after an hour of building is an expensive way to find
    # that out.
    permissions:
      contents: write
    # A cold release build of libservo (SpiderMonkey + ANGLE) plus a second
    # feature-distinct build for motor-controller does not fit in the default
    # timeout.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2

      # Workaround for https://github.com/actions/runner-images/issues/10001
      - name: Upgrade llvm
        run: choco upgrade llvm

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Bootstrap
        run: |
          .\mach fetch
          .\mach bootstrap-gstreamer

      - name: Put GStreamer on PATH
        # mach installs GStreamer under $CARGO_TARGET_DIR/dependencies; raw cargo
        # finds its pkg-config only if that bin dir is on PATH.
        run: |
          $gst = "$env:CARGO_TARGET_DIR\dependencies\gstreamer\1.0\msvc_X86_64"
          "$gst\bin" >> $env:GITHUB_PATH
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gst" >> $env:GITHUB_ENV

      # Cheap, and it fails in seconds if the default-feature (StubWebView-only)
      # build has regressed - before spending hours on libservo.
      - name: Test motor-controller (default features, no engine)
        working-directory: vendor/motor-controller
        run: cargo test

      # NOTE: nothing in this tree builds a `servo.dll`. libservo is an rlib and
      # `-p servoshell` is an .exe; the cdylibs are ffi/capi (which cargo names
      # servo_capi.dll) and vendor/zdr-capi-shim (servo_capi_full.dll, renamed
      # below).
      #
      # WHY THE SHIM AND NOT ffi/capi: servo_capi.dll exports thirty of the
      # forty-two entry points a single-window embedder needs. The twelve it is
      # missing - native rendering context, input, scroll, focus, resize, HiDPI -
      # cannot be added by a crate that merely links to ffi/capi, because a
      # cdylib is not linkable from Rust and the internals they need are
      # `pub(crate)`. vendor/zdr-capi-shim therefore *includes* ffi/capi's own
      # lib.rs and adds the twelve, so servo_capi_full.dll is a strict superset
      # of servo_capi.dll built from the same source. See that crate's README.
      #
      # The shim and servoshell are built in one invocation on purpose: separate
      # invocations resolve different libservo feature sets and would each
      # compile SpiderMonkey again. `-p servo-capi` is deliberately NOT in this
      # list - the shim compiles every line of it already, so building it too
      # would only add a second multi-minute cdylib link of the same code.
      #
      # The multiprocess feature is enabled on the shim rather than globally:
      # `--features multiprocess` in a multi-package build would try to apply it
      # to servoshell too, which does not declare it. Note that a payload built
      # this way resolves a different libservo feature set from the default one,
      # so it recompiles SpiderMonkey rather than reusing the push build's cache.
      - name: Build libservo C ABI DLL and servoshell (release)
        run: cargo build -p zdr-capi-shim -p servoshell --release ${{ inputs.multiprocess && '--features zdr-capi-shim/multiprocess' || '' }}

      - name: Stage servo.dll
        run: |
          $rel = "$env:CARGO_TARGET_DIR\release"
          Copy-Item "$rel\servo_capi_full.dll" "$rel\servo.dll" -Force

          # mozangle's build script emits ANGLE's pair under
          # `<profile>/build/mozangle-<hash>/out`, and nothing in cargo moves
          # them next to the other artifacts. `mach build` copies them itself
          # (copy_windows_dlls_to_build_directory in
          # python/servo/build_commands.py), as does tests/capi/build.rs; this
          # job runs raw cargo, so it has to do the same copy. Several
          # `mozangle-*` directories can exist when dependents resolve
          # different feature sets - they all build the same ANGLE, so take
          # the most recent.
          foreach ($dll in "libEGL.dll", "libGLESv2.dll") {
            $built = Get-ChildItem "$rel\build" -Filter $dll -Recurse -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if (-not $built) {
              Write-Host "::error::$dll was not built under $rel\build"
              exit 1
            }
            Copy-Item $built.FullName "$rel\$dll" -Force
          }

          Get-ChildItem "$rel\servo.dll", "$rel\libEGL.dll", "$rel\libGLESv2.dll" |
            Select-Object Name, Length

      # The gate this workflow exists to hold. An embedder that loads a payload
      # exporting only thirty of these can open a page and take a screenshot of
      # it, and can do nothing else with it - no clicking, no typing, no
      # scrolling, no resize. That failure shows up as a dead viewport at
      # runtime, so it is worth catching here instead.
      #
      # llvm-readobj rather than dumpbin: LLVM is already installed and on a
      # known path for this job, whereas dumpbin needs a Visual Studio developer
      # environment to be located first. `dumpbin /exports servo.dll` lists the
      # same names.
      - name: Check the export surface
        run: |
          $rel = "$env:CARGO_TARGET_DIR\release"
          $readobj = "$env:LIBCLANG_PATH\llvm-readobj.exe"

          # -CaseSensitive matters: Stylo links five `Servo_NumericType_*`
          # exports into this same DLL, and Select-String matches
          # case-insensitively by default. Without the flag the reported count is
          # five higher than the capi surface, which both misreports the total and
          # slackens the floor below by five.
          $exports = & $readobj --coff-exports "$rel\servo.dll" |
            Select-String -CaseSensitive -Pattern '^\s*Name:\s*(servo_\w+)\s*$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Sort-Object -Unique

          Write-Host "servo.dll exports $($exports.Count) servo_* symbols"

          # A count cannot say WHICH export went missing, so a payload that clears
          # the floor while lacking a name fails on the embedder's side at runtime
          # rather than here - the wrong end to find out. Hence names, one by one.
          #
          # The embedder resolves in two classes, and they are not interchangeable:
          #
          #   required - absence fails the embedder's library load outright. No
          #              viewport, nothing runs. Naming these is pure correctness:
          #              absence is unconditionally fatal and there is no policy in
          #              the decision.
          #   optional - resolved if present, skipped if absent, so an OLDER payload
          #              still loads. Naming one is a PROMISE, not a check: from then
          #              on this fork has committed to shipping it forever, and the
          #              backward tolerance the optional class exists to provide is
          #              given up. Add here deliberately, never by reflex.

          # All thirty. Absence of any one of these fails the embedder's library
          # load outright, so every one is checked by name. Enumerated from the
          # embedder's binding rather than reconstructed here, and every name
          # verified present in a built DLL's PE export table before landing - a
          # name correct in the binding but absent from the payload would turn this
          # correctness fix into a red build and invite the wrong diagnosis.
          #
          # Two entries that look odd and are not:
          #
          #   servo_rendering_context_create_software is required while
          #   create_native is optional. It is the fallback surface and the one
          #   entry point that cannot itself depend on ANGLE having loaded. It is
          #   also the older of the two - create_native arrives with the shim -
          #   so an older payload has software and not native, which is exactly
          #   the direction the optional class exists to tolerate.
          #
          #   servo_webview_take_screenshot is load-bearing beyond its name: it is
          #   how the embedder distinguishes "the engine is not drawing" from "the
          #   engine draws and nothing is presented". Losing it costs the only
          #   instrument that separates those two failures.
          $required = @(
            'servo_builder_build',
            'servo_builder_create',
            'servo_builder_free',
            'servo_builder_set_event_loop_waker',
            'servo_builder_set_options',
            'servo_builder_set_preferences',
            'servo_free',
            'servo_options_create',
            'servo_options_free',
            'servo_options_set_config_dir',
            'servo_options_set_debug_option',
            'servo_options_set_hard_fail',
            'servo_options_set_multiprocess',
            'servo_options_set_sandbox',
            'servo_preferences_create',
            'servo_preferences_free',
            'servo_preferences_set_bool',
            'servo_rendering_context_create_software',
            'servo_rendering_context_free',
            'servo_setup_logging',
            'servo_spin_event_loop',
            'servo_webview_builder_build',
            'servo_webview_builder_create',
            'servo_webview_builder_free',
            'servo_webview_builder_set_delegate',
            'servo_webview_builder_set_url',
            'servo_webview_free',
            'servo_webview_load',
            'servo_webview_paint',
            'servo_webview_take_screenshot'
          )

          # Promises, per the note above: the twelve `ffi/capi` does not define and
          # that vendor/zdr-capi-shim adds, plus the ABI version query, which is how
          # an embedder detects a stale payload before reading a struct whose shape
          # it has guessed wrong. These were inherited rather than chosen; they are
          # very likely right, but the commitment is now explicit.
          $optional = @(
            'servo_rendering_context_create_native',
            'servo_rendering_context_set_window',
            'servo_rendering_context_take_window',
            'servo_rendering_context_clone',
            'servo_webview_resize',
            'servo_webview_notify_input_event',
            'servo_webview_notify_scroll_event',
            'servo_webview_focus',
            'servo_webview_blur',
            'servo_webview_focused',
            'servo_webview_builder_set_hidpi_scale_factor',
            'servo_webview_set_hidpi_scale_factor',
            'servo_capi_abi_version',
            # The second half of drawing. servo_webview_paint renders into the
            # context's surface; without present that surface is never shown, so
            # the window never updates while the engine correctly reports frames.
            # Classified here in the commit that implements it, which is what
            # silences the $planned check below.
            'servo_rendering_context_present',
            # Sizes the surface. servo_webview_resize sizes the page; they are
            # different sizes and the surface must be sized first.
            'servo_rendering_context_resize',
            # Lets a library embedder service the content-process re-exec.
            # servo_options_set_multiprocess is settable without it, but the
            # child is the HOST's binary, which has never heard of
            # --content-process, so it exits and nothing renders. Classified
            # here in the commit that implements it, which is what silences
            # the $planned check below.
            'servo_content_process_main',
            # Installs the embedder's own script into every document a webview
            # loads. The builder call is what creates the user-content manager,
            # so the webview call only works on a webview built with at least one
            # script; both are classified here in the commit that implements them.
            'servo_webview_builder_add_script',
            'servo_webview_add_script',
            # Accepts a script-requested new browsing context. Without it the
            # request_create_new delegate can only decline, since claiming the
            # request is the only thing that makes the open proceed.
            'servo_webview_accept_new',
            # Says which feature set this payload was built with. Two payloads
            # that differ only in a feature are indistinguishable by inspection,
            # so this is how an embedder refuses at load instead of discovering
            # it when the behaviour turns out to be absent.
            'servo_capi_build_features'
          )

          $gated = $required + $optional
          $missingRequired = $required | Where-Object { $exports -notcontains $_ }
          $missingOptional = $optional | Where-Object { $exports -notcontains $_ }

          if ($missingRequired) {
            Write-Host "::error::servo.dll is missing $($missingRequired.Count) REQUIRED symbol(s); the embedder's library load fails outright: $($missingRequired -join ', ')"
          }
          if ($missingOptional) {
            Write-Host "::error::servo.dll is missing $($missingOptional.Count) promised optional symbol(s): $($missingOptional -join ', ')"
          }
          if ($missingRequired -or $missingOptional) { exit 1 }

          # Sequencing tripwire.
          #
          # A symbol cannot be gated before it exists - naming one that does not
          # would fail this job on every run until it lands, including the branch
          # that adds it. So a planned-but-unimplemented entry point cannot be
          # named in advance, which leaves a hole: the branch that implements one
          # ships it without ever adding it above, this gate stays green, and a
          # payload that still cannot display anything passes.
          #
          # This closes the hole from the other side. If a planned symbol appears
          # in the DLL and has not been classified above, fail and say so. The
          # check is inert until the symbol ships, and the commit that ships it is
          # then the commit that has to classify it.
          # Both entries below are now implemented and classified as optional
          # above, so this check is satisfied by them rather than inert. Keep them
          # listed: the check costs nothing and it is the record of which symbols
          # were promised before they existed. Add future planned entry points
          # here so the same protection covers them.
          #
          # servo_rendering_context_make_current is deliberately NOT listed. It is
          # exported and required by the paint/present sequence - neither paint nor
          # present binds the context, so an embedder that skips it presents an
          # unbound surface - but the embedder's binding does not declare it yet.
          # Gating it would promise a symbol nobody resolves. Add it to $optional
          # when the binding picks it up.
          $planned = @(
            'servo_rendering_context_present',
            'servo_rendering_context_resize'
          )
          $ungated = $planned | Where-Object {
            ($exports -contains $_) -and ($gated -notcontains $_)
          }
          if ($ungated) {
            $names = $ungated -join ', '
            Write-Host "::error::servo.dll exports $($ungated.Count) planned symbol(s) this gate does not check: $names. Add each to the required or optional list in the same commit that implements it - a payload can otherwise pass this job and still display nothing."
            exit 1
          }

          # 42 is what a single-window embedder binds: thirty required plus twelve
          # of the optional set. It is a floor, not the current surface - additive
          # growth must not fail this job - and raising it is a policy call about
          # deliberate removals rather than a correctness fix, so it stays put.
          #
          # With all thirty required symbols and thirteen optional ones now checked
          # by name above, this is a backstop rather than the primary check: it
          # catches wholesale collapse in the twenty-two exports nobody binds,
          # which names cannot cover because no list declares them.
          if ($exports.Count -lt 42) {
            Write-Host "::error::servo.dll exports only $($exports.Count) servo_* symbols, expected at least 42"
            exit 1
          }

          $exports | ForEach-Object { Write-Host "  $_" }

      # Provenance for the payload. The three DLLs must be dropped into an
      # embedder's tree together, from this one run: mixing a servo.dll from one
      # run with ANGLE from another is a silently skewed engine. Recording the
      # hashes and the commit here is what lets someone check later that they
      # did not do that.
      - name: Record SHA-256s
        run: |
          $rel = "$env:CARGO_TARGET_DIR\release"
          $files = "servo.dll", "libEGL.dll", "libGLESv2.dll"

          $rows = $files | ForEach-Object {
            $hash = (Get-FileHash "$rel\$_" -Algorithm SHA256).Hash.ToLower()
            Write-Host "$hash  $_"
            [pscustomobject]@{ File = $_; 'SHA-256' = $hash }
          }

          "## libservo-windows-dll" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Commit ``$env:GITHUB_SHA``, run ``$env:GITHUB_RUN_ID``. All three files are from this run; do not mix them with files from another." >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| File | SHA-256 |" >> $env:GITHUB_STEP_SUMMARY
          "| :--- | :--- |" >> $env:GITHUB_STEP_SUMMARY
          $rows | ForEach-Object { "| ``$($_.File)`` | ``$($_.'SHA-256')`` |" >> $env:GITHUB_STEP_SUMMARY }

      # The multiprocess payload is named apart from the default one on purpose.
      # They are the same three files and differ only in a feature that changes
      # whether content runs in this process, which is not visible by inspecting
      # them; one name for both is how the wrong one gets staged.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libservo-windows-dll${{ inputs.multiprocess && '-multiprocess' || '' }}
          # Exactly three files, all from this run. ANGLE's pair is not
          # optional: servo.dll needs it at runtime on Windows (see
          # ffi/capi/Cargo.toml), and surfman `LoadLibrary`s it by name when the
          # first rendering context is created, so it has to travel with the
          # engine.
          path: |
            target/release/servo.dll
            target/release/libEGL.dll
            target/release/libGLESv2.dll
          if-no-files-found: error
          retention-days: 30

      # Only on an explicit dispatch. Deliberately after the artifact upload, so
      # that a failure to publish still leaves the payload downloadable, and before
      # the seam build for the same reason that step is last.
      #
      # The tag names the commit rather than a version: this payload is identified
      # by what built it, and the engine's own crate version says nothing about the
      # C ABI, which is what an embedder actually binds against. The ABI version and
      # the feature set are recorded in the body instead, since the three files are
      # indistinguishable from the ones built with different features.
      - name: Publish GitHub release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = "$env:CARGO_TARGET_DIR\release"
          $suffix = if ("${{ inputs.multiprocess }}" -eq "true") { "-multiprocess" } else { "" }
          $tag = "capi-$($env:GITHUB_SHA.Substring(0,11))$suffix"

          $files = @("$rel\servo.dll", "$rel\libEGL.dll", "$rel\libGLESv2.dll")
          Get-FileHash -Algorithm SHA256 $files |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding utf8 "$rel\SHA256SUMS"

          $notes = @"
          Windows libservo C ABI payload built from ``$env:GITHUB_SHA``.

          | | |
          | :--- | :--- |
          | commit | ``$env:GITHUB_SHA`` |
          | C ABI version | reported by ``servo_capi_abi_version()`` |
          | multiprocess feature | ${{ inputs.multiprocess && 'on' || 'off' }} |
          | workflow run | $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID |

          Load ``servo.dll`` with ``libEGL.dll`` and ``libGLESv2.dll`` beside it; surfman
          loads ANGLE by name when the first rendering context is created, so all three
          must travel together. ``servo_capi_build_features()`` reports which feature set
          this payload was built with.

          The matching ``servo_capi.h`` is not attached: it is produced by ``cargo-c``,
          which this job does not run, and generating it would mean a second cdylib link
          of the same code.

          Licensed under MPL-2.0. Source is this repository at the commit above.
          "@
          $notes = $notes -replace '(?m)^          ', ''
          Set-Content -Encoding utf8 "$env:RUNNER_TEMP\notes.md" $notes

          gh release create $tag $files "$rel\SHA256SUMS" `
            --target $env:GITHUB_SHA `
            --title $tag `
            --notes-file "$env:RUNNER_TEMP\notes.md"

      # Last, so a failure here cannot cost the run its DLL artifact.
      - name: Build motor-controller against real libservo (release)
        working-directory: vendor/motor-controller
        run: cargo build -p motor-controller --features servo-backend --release
